name: Deploy Go Application

on:
  push:
    branches: 
      - main
  
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Create .env file
        run: |
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
      - name: login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t iamsrikrishnaa/varthagan:latest .
        
      - name: Push Docker image
        run: docker push iamsrikrishnaa/varthagan:latest

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: pull docker image
        run: docker pull iamsrikrishnaa/varthagan:latest
      - name: run docker container
        run: |
          docker stop auth-service || true
          docker rm auth-service || true
          docker run -d --name auth-service -p 8088:8088 --env-file .env iamsrikrishnaa/varthagan:latest